# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit pull request reviews. Only settings that differ from CodeRabbit's
# defaults are listed; the full reference is
# https://docs.coderabbit.ai/reference/configuration.
#
# Open-source projects get a per-developer allowance of PR reviews per hour, and
# every reviewed push spends one. Public repositories with fewer than 10 stars
# are only reviewed on request: comment `@coderabbitai review` on the PR, or
# `@coderabbitai full review` to start over. Draft PRs are skipped, so open a
# draft while iterating and mark it ready when it should be reviewed.

language: en-GB

reviews:
  # Keeps the summary in CodeRabbit's walkthrough comment instead of appending
  # it to the PR description, which stays the author's own and doesn't fire an
  # `edited` run of the PR title check.
  high_level_summary_in_walkthrough: true

  # Excluded files don't count towards the per-review file limit.
  path_filters:
    - "!pnpm-lock.yaml"
    - "!CHANGELOG.md"
    - "!.release-please-manifest.json"
    - "!bench/results/**"

  path_instructions:
    - path: "src/**"
      instructions: >-
        Files, query results and schemas must never leave the browser: Blinkql
        has no backend and collects nothing. Flag any network request,
        telemetry, logging or persistent storage that could carry them. A share
        link may hold only the query text and chart settings.
    - path: "**/*.{test,spec,tests}.{ts,tsx}"
      instructions: >-
        Flag any change that weakens an existing test (removed or loosened
        assertions, new skips, widened timeouts) without a stated reason.
    - path: ".github/workflows/**"
      instructions: >-
        Job names are the required status checks in the `main` ruleset. Flag a
        renamed or removed job, since the ruleset has to change with it.

  auto_review:
    # release-please opens these under the maintainer's account, so reviewing
    # them would spend the maintainer's allowance on a generated changelog.
    ignore_title_keywords:
      - "chore(main): release"

  pre_merge_checks:
    # The PR title check workflow already enforces Conventional Commits.
    title:
      mode: "off"

  tools:
    # CI runs `biome ci` with the repository's own configuration.
    biome:
      enabled: false

knowledge_base:
  code_guidelines:
    filePatterns:
      - CONTRIBUTING.md
