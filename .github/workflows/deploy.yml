# Builds on GitHub Actions and uploads the prebuilt output to Vercel.
# Vercel's own Git builds are switched off (vercel.json + Ignored Build Step),
# so this workflow is the only thing that deploys.
#
#   CI passes on main   -> production (a push to main deploys only after CI succeeds)
#   pull request        -> preview (same-repo branches only; forks and Dependabot
#                          get no secrets)
#   manual run          -> production
#
# workflow_run always uses this file as it is on main, so changes to the
# production trigger take effect only after they're merged.
#
# Needs the repository secret VERCEL_TOKEN (vercel.com/account/tokens).

name: Deploy

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_9s3k9SAVh1EvcghKkL2Lv3hh
  VERCEL_PROJECT_ID: prj_ZYMbLwKzTqOSE51hwfvZPsWVGkoY
  VERCEL_CLI_VERSION: 60.1.3

jobs:
  deploy:
    # Previews: same-repo PRs, except Dependabot's. Production: CI succeeded for a push to main, or a manual run.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check for Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # For workflow_run, deploy exactly the commit CI tested, not whatever main points to now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Installs the pnpm version pinned in package.json's packageManager field,
      # so `vercel build` installs with the same pnpm as local development.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Set target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      # Stops before uploading if the build output lost any header from vercel.json.
      # Works for previews too, which sit behind Vercel's login and can't be fetched directly.
      - name: Check headers in build output
        run: node scripts/verify-headers.ts --build-output .vercel/output

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      # The production domain is public, so check what browsers actually receive.
      - name: Check headers on production
        if: steps.target.outputs.env == 'production'
        run: node scripts/verify-headers.ts --url "$PRODUCTION_URL"
        env:
          PRODUCTION_URL: https://blinkql.vercel.app
