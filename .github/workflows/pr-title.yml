# PRs are squash-merged, so the PR title becomes the commit message on main.
# Local commit-msg hooks never see it, so it's checked here with the same
# commitlint config. The PR's commits and description are also checked for AI
# attribution (e.g. a `Co-authored-by: Claude …` trailer), which GitHub would
# otherwise copy into the squash commit; hooks skipped with --no-verify can't
# skip this.

name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: 0

      # The title is passed through an environment variable, never interpolated
      # into the script, so a crafted title can't inject shell commands.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Check commits and description for AI attribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-ai-attribution.ts
