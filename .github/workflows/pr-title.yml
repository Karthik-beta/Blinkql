# PRs are squash-merged, so the PR title becomes the commit message on main.
# Local commit-msg hooks never see it, so it's checked here with the same
# commitlint config.

name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: 0

      # The title is passed through an environment variable, never interpolated
      # into the script, so a crafted title can't inject shell commands.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
