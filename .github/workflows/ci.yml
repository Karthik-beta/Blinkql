# Checks every pull request and every push to main.
#
#   checks          typecheck, Biome, unit tests, production build
#   e2e (browser)   Playwright on Chromium, Firefox and WebKit, in parallel
#
# The job names are the required status checks in the `main` ruleset, so
# renaming a job means updating the ruleset too. Production deploys wait for
# this workflow to pass on main (see deploy.yml).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish because the
  # production deploy waits for them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are for local commits; skip installing them on CI runners.
  LEFTHOOK: 0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format (Biome)
        run: pnpm exec biome ci

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # One cache entry per browser and Playwright version, so a Playwright
      # upgrade starts a fresh cache and each job restores only its browser.
      - name: Cache Playwright browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install ${{ matrix.browser }}

      # The packages apt downloaded for the browser's OS libraries on an earlier
      # run, so a run only downloads what has changed since. The mirror sometimes
      # serves them at a few dozen KB a second.
      - name: Restore system dependency packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # The browser cache holds the browser only; its OS libraries still need
      # installing. This usually takes under a minute, but apt sometimes stalls for
      # 10 minutes or more and uses up the job's timeout, so each attempt gets 3
      # minutes and a stalled one is retried. sudo runs apt in its own session, out
      # of the timeout's reach, so a stalled apt-get is killed before the next
      # attempt, which resumes its partial downloads. `dpkg --configure -a` finishes
      # what a killed attempt left half-installed.
      - name: Install system dependencies
        run: |
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 3m pnpm exec playwright install-deps ${{ matrix.browser }}; then
              mkdir -p ~/apt-archives
              cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
              exit 0
            fi
            echo "::warning::Installing system dependencies failed or stalled (attempt $attempt of 3)"
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            sudo dpkg --configure -a || true
          done
          exit 1

      # Saved straight away, so a run whose tests fail still keeps the packages.
      - name: Save system dependency packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Run Playwright
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
