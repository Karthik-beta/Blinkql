name: Bug report
description: Something in Blinkql doesn't work as documented.
title: "bug: "
labels: ["bug", "needs triage"]
projects: ["Karthik-beta/2"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        > **Never attach real personal or confidential data.** Use a small *synthetic* file that reproduces the shape of the problem.
        > Found a security vulnerability? Please report it [privately](https://github.com/Karthik-beta/Blinkql/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error message shown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open blinkql.vercel.app
        2. Drop `sample.csv`
        3. Run `SELECT ...`
        4. See error
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: SQL query
      description: The query that triggered the problem, if any.
      render: sql
  - type: dropdown
    id: format
    attributes:
      label: File format
      multiple: true
      options:
        - CSV
        - Parquet
        - JSON / JSON-lines
        - Remote file (URL)
        - Not file-related
  - type: input
    id: size
    attributes:
      label: Approximate file size and row count
      placeholder: e.g. 450 MB, ~3M rows
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser version, OS and RAM
      placeholder: e.g. Chrome 141, Windows 11, 16 GB
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Anything relevant from the browser DevTools console.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: Any attached files contain synthetic data only.
          required: true
